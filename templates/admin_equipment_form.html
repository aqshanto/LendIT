{% extends "base.html" %}

{% block title %}{{ heading }} - LendIt{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title mb-3">{{ heading }}</h2>

                <!-- The same form is used for adding and editing.
                     Only form_action changes. -->
                <form method="POST" action="{{ form_action }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label" for="name">Name</label>
                        <input type="text" class="form-control" id="name" name="name"
                               maxlength="100" value="{{ name }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="category">Category</label>
                        <input type="text" class="form-control" id="category" name="category"
                               maxlength="50" value="{{ category }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="description">Description (optional)</label>
                        <textarea class="form-control" id="description" name="description"
                                  rows="3">{{ description }}</textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">Save</button>
                    <a href="{{ url_for('admin_equipment') }}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
